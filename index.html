
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Agroconecta | Premium AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
            },
            colors: {
              app: {
                bg: 'var(--app-bg)',
                card: 'var(--app-card)',
                text: 'var(--app-text)',
                muted: 'var(--app-text-muted)',
                border: 'var(--app-border)',
                accent: 'var(--app-accent)',
              }
            },
            boxShadow: {
              'glow': '0 0 20px rgba(255, 255, 255, 0.15)',
              'glow-sm': '0 0 10px rgba(255, 255, 255, 0.1)',
              'glow-lg': '0 0 30px rgba(255, 255, 255, 0.2)',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              pulseSlow: {
                 '0%, 100%': { opacity: '1' },
                 '50%': { opacity: '0.5' },
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'spin-slow': 'spin 8s linear infinite',
              'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Premium Monochrome Glass Theme */
        --app-bg: #030303; /* Deepest black */
        --app-card: rgba(25, 25, 25, 0.4); /* Glassmorphism base */
        --app-text: #ffffff;
        --app-text-muted: #888888; /* Subtle gray */
        --app-border: rgba(255, 255, 255, 0.08); /* Delicate border */
        --app-accent: #ffffff; /* White accent for stark contrast */
        --glass-surface: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      body {
        background-color: var(--app-bg);
        color: var(--app-text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.5s ease, color 0.5s ease;
        background-image: 
          radial-gradient(circle at 15% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
          radial-gradient(circle at 85% 30%, rgba(255,255,255,0.04) 0%, transparent 50%);
      }
      
      /* Glassmorphism helpers */
      .glass-panel {
        background: var(--glass-surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* Glow on hover helpers */
      .glow-hover {
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
      }
      .glow-hover:hover {
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--app-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.4);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react": "https://esm.sh/react@18.2.0",

    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "maath/": "https://esm.sh/maath@0.10.7/",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>

</head>
